<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Local AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Local AI home"><span class="brand-mark" aria-hidden="true">✳</span>Local AI</a>
      <nav class="tabs" aria-label="Main navigation" role="tablist">
        <button class="tab active" id="chat-tab" type="button" role="tab" aria-selected="true" aria-controls="chat-panel">Chat</button>
        <button class="tab" id="documents-tab" type="button" role="tab" aria-selected="false" aria-controls="documents-panel">Document manager</button>
      </nav>
      <div class="model-label"><span class="status-dot" aria-hidden="true"></span>Gemma 3</div>
    </header>

    <main class="main-content">
      <section id="chat-panel" class="panel chat-panel" role="tabpanel" aria-labelledby="chat-tab">
        <div class="view-header">
          <h1>Chat with Gemma</h1>
          <p>A private conversation with your local AI model.</p>
          <button id="clear-button" class="text-button" type="button">New chat</button>
        </div>
        <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversation">
          <p class="empty-chat" id="welcome">Ask Gemma anything to get started.</p>
        </section>
        <div class="composer-area">
          <div id="error-message" class="error-message" role="alert" hidden></div>
          <form id="chat-form" class="composer">
            <label class="visually-hidden" for="message-input">Message</label>
            <textarea id="message-input" rows="1" placeholder="Write a message..." required></textarea>
            <button id="send-button" class="send-button" type="submit"><span>Send</span><span aria-hidden="true">↑</span></button>
          </form>
        </div>
      </section>

      <section id="documents-panel" class="panel documents-panel" role="tabpanel" aria-labelledby="documents-tab" hidden>
        <div class="documents-header">
          <h1>Document manager</h1>
          <p>Manage your local PDF collection.</p>
        </div>

        <section class="add-section" aria-labelledby="add-heading">
          <h2 id="add-heading">Add documents</h2>
          <form id="upload-form" class="upload-form">
            <input id="file-input" name="file" type="file" accept="application/pdf,.pdf" aria-label="Choose PDF file">
            <button id="upload-button" class="upload-button" type="submit" disabled>Upload</button>
          </form>
          <p class="size-note">PDF files only · Maximum file size: 50 MB</p>
          <div id="upload-error" class="error-message" role="alert" hidden></div>
        </section>

        <section class="files-section" aria-labelledby="files-heading">
          <div class="files-heading-row">
            <h2 id="files-heading">Your files</h2>
            <span id="file-count" class="file-count"></span>
          </div>
          <div id="file-list" class="file-list" aria-live="polite"></div>
          <p id="empty-files" class="empty-files" hidden>No PDFs uploaded yet.</p>
        </section>
      </section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
</body>
</html>
